name: ssrs-sales-reports
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - ./sql:/lab/sql:ro
      - ./data:/var/opt/mssql/import:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "tcp:localhost,1433", "-C", "-U", "sa", "-b", "-Q", "SELECT 1"]
      interval: 8s
      timeout: 5s
      retries: 24
      start_period: 15s
