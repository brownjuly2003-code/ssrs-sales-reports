# SSRS on a GitHub-hosted Windows runner: SQL Server 2022 Developer (Database Engine and
# SQL Server Agent) and SQL Server 2022 Reporting Services are installed on the runner, the
# retail database is loaded, rdl/SalesStock.rdl is published and rendered by the server through
# its own data source, the parameter cascade is asked from the server, and a scheduled e-mail
# subscription is created by the project script and run through its SQL Server Agent job.
# Manual start only (gh workflow run ssrs-windows.yml). Without a push or pull_request trigger
# the local CI does not select this file; the Linux jobs stay in ci.yml.
name: SSRS on Windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ssrs-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssrs:
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      EVIDENCE: reports/ssrs
      RS_URL: http://localhost/ReportServer
      RS_CLIENT: rsclient
      READER_LOGIN: retail_reader
      MAIL_TO: reports@example.invalid
      # SQL Server 2022 Developer ISO from download.microsoft.com. URL and SHA-256 as pinned by the
      # Chocolatey package sql-server-2022 (https://community.chocolatey.org/packages/sql-server-2022).
      SQL_ISO_URL: https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso
      SQL_ISO_SHA256: 80D2CD75DD2B28098C0182F50AD86BD44F9B3A9F357C30FF617480A1497DAFFD
      # SQL Server 2022 Reporting Services installer from download.microsoft.com, the URL of the
      # Chocolatey package ssrs-2022 (https://community.chocolatey.org/packages/ssrs-2022). The file
      # behind it was replaced on 2026-11-19 (Last-Modified); the SHA-256 is of the file downloaded
      # on 2026-11-21: 137187696 bytes, version 16.0.9819.33617, Authenticode signature of
      # Microsoft Corporation valid. The Chocolatey checksum (e120389f…) is of an older build.
      # The same URL served another build to the GitHub runner on 2026-11-21 (run 44911770474):
      # 137688208 bytes, version 16.0.9813.1253, signature of Microsoft Corporation valid. Mirrors of
      # download.microsoft.com differ, so both known files are accepted, and nothing else.
      SSRS_URL: https://download.microsoft.com/download/8/3/2/832616ff-af64-42b5-a0b1-5eb07f71dec9/SQLServerReportingServices.exe
      SSRS_SHA256: FA1CBA25C8AEF0A1EE2AB76C809CC5599338740004483C46616C1633BFAD5961
      SSRS_SHA256_ALT: 8CE31ED8296F6E44A842F71AB3303D2251AAD641516A344CE0A474CB75BC2466
      SETUP_LOG: 'C:\Program Files\Microsoft SQL Server\160\Setup Bootstrap\Log'
      RS_LOG: 'C:\Program Files\Microsoft SQL Server Reporting Services\SSRS\LogFiles'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: 1. Python dependencies, seeded CSV and the offline reference
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          python --version
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "pip install exited with $LASTEXITCODE" }
          python -m ssrs_lab generate
          if ($LASTEXITCODE -ne 0) { throw "generate exited with $LASTEXITCODE" }
          python -m ssrs_lab reference
          if ($LASTEXITCODE -ne 0) { throw "reference exited with $LASTEXITCODE" }
          python scripts/audit.py --verify-archive docs/runs/offline-evidence.zip
          if ($LASTEXITCODE -ne 0) { throw 'The generated data differ from the archived reference.' }
          # Passwords of this run: generated here, masked in the log, kept only in the job environment.
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          foreach ($name in 'SA_PASSWORD', 'READER_PASSWORD', 'CLIENT_PASSWORD') {
            $bytes = New-Object byte[] 18
            $rng.GetBytes($bytes)
            $value = 'Aa1!' + (-join ($bytes | ForEach-Object { $_.ToString('x2') }))
            Write-Output "::add-mask::$value"
            [IO.File]::AppendAllText($env:GITHUB_ENV, "$name=$value`n")
          }
          $line = 'reference: seed 39 CSV and reports/reference.json match docs/runs/offline-evidence.zip'
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line

      - name: 2a. Download the SQL Server 2022 Developer ISO and check its SHA-256
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'
          curl.exe -fsSL --retry 3 -o $iso $env:SQL_ISO_URL
          if ($LASTEXITCODE -ne 0) { throw "curl exited with $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $iso).Hash
          $line = "SQL Server media: SQLServer2022-x64-ENU-Dev.iso, $((Get-Item -LiteralPath $iso).Length) bytes, SHA-256 $hash"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($hash -ne $env:SQL_ISO_SHA256) { throw "SHA-256 differs from the pinned $env:SQL_ISO_SHA256" }

      - name: 2b. Sector size of the disks; a virtual disk for the database files if C reports more than 4 KB (scripts/Select-SqlDataVolume.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          # SQL Server supports 512-byte and 4 KB sectors; some runners report 8 KB on C: and setup then
          # fails with error 5178 on master.mdf (sources in the script). The registry fix needs a reboot.
          & .\scripts\Select-SqlDataVolume.ps1 -Folder $env:RUNNER_TEMP -EnvFile $env:GITHUB_ENV |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/sectors.txt" -Value $_; $_ } |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_; $_ }

      - name: 2c. Install SQL Server 2022 Developer - Database Engine, SQL Server Agent, mixed authentication
        timeout-minutes: 50
        run: |
          $ErrorActionPreference = 'Stop'
          $iso = Join-Path $env:RUNNER_TEMP 'SQLServer2022-x64-ENU-Dev.iso'
          foreach ($key in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending',
                           'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') {
            Write-Output "pending reboot marker $key present: $(Test-Path $key)"
          }
          $image = Mount-DiskImage -ImagePath $iso -PassThru
          $letter = $null
          for ($i = 1; $i -le 10 -and -not $letter; $i++) {
            $letter = ($image | Get-Volume).DriveLetter
            if (-not $letter) { Start-Sleep -Seconds 3 }
          }
          if (-not $letter) { throw 'The mounted ISO got no drive letter.' }
          $setup = "${letter}:\setup.exe"
          Write-Output "setup: $setup $((Get-Item $setup).VersionInfo.ProductVersion)"
          $who = "$env:USERDOMAIN\$env:USERNAME"
          # Parameters: https://learn.microsoft.com/sql/database-engine/install-windows/install-sql-server-from-the-command-prompt
          # SQL Server Agent runs the schedules of SSRS subscriptions; mixed authentication is for the
          # SQL login whose credentials the report data source stores (subscriptions need stored credentials).
          $arguments = @(
            '/Q', '/ACTION=Install', '/IACCEPTSQLSERVERLICENSETERMS', '/UPDATEENABLED=False',
            '/FEATURES=SQLENGINE', '/INSTANCENAME=MSSQLSERVER',
            '/SQLSVCACCOUNT="NT Service\MSSQLSERVER"', "/SQLSYSADMINACCOUNTS=`"$who`" `"BUILTIN\Administrators`"",
            '/AGTSVCACCOUNT="NT Service\SQLSERVERAGENT"', '/AGTSVCSTARTUPTYPE=Automatic',
            '/SECURITYMODE=SQL', "/SAPWD=`"$env:SA_PASSWORD`"",
            '/TCPENABLED=1', '/SkipRules=RebootRequiredCheck'
          )
          # System databases, tempdb, user databases and backups default to folders under
          # INSTALLSQLDATADIR (parameter reference above), so one parameter moves them all; step 2d checks it.
          if ($env:SQL_DATA_ROOT) { $arguments += "/INSTALLSQLDATADIR=`"$env:SQL_DATA_ROOT`"" }
          $arguments = $arguments -join ' '
          Write-Output "setup arguments: $($arguments.Replace($env:SA_PASSWORD, '***'))"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          $code = $process.ExitCode
          $minutes = [math]::Round($watch.Elapsed.TotalMinutes, 1)
          $summaryFile = Join-Path $env:SETUP_LOG 'Summary.txt'
          if (Test-Path -LiteralPath $summaryFile) {
            Write-Output '--- Summary.txt (head) ---'
            Get-Content -LiteralPath $summaryFile -TotalCount 40
          }
          $where = if ($env:SQL_DATA_ROOT) { "data in $env:SQL_DATA_ROOT" } else { 'default data folder' }
          $line = "SQL Server setup: exit code $code in $minutes min (features SQLENGINE, Agent automatic, SECURITYMODE=SQL, $where)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($code -ne 0 -and $code -ne 3010) {
            if (Test-Path -LiteralPath $summaryFile) {
              Write-Output '--- Summary.txt (tail) ---'
              Get-Content -LiteralPath $summaryFile -Tail 80
            }
            throw "SQL Server setup exited with $code"
          }
          Dismount-DiskImage -ImagePath $iso | Out-Null

      - name: 2d. Wait for SQL Server and SQL Server Agent; sqlcmd; version and edition; where the database files are
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'MSSQLSERVER', 'SQLSERVERAGENT') {
            $service = Get-Service -Name $name
            if ($service.Status -ne 'Running') { Start-Service -Name $name }
            $service.WaitForStatus('Running', [TimeSpan]::FromMinutes(3))
            Get-CimInstance Win32_Service -Filter "Name='$name'" | Format-List Name, State, StartMode, StartName
          }
          $sqlcmd = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sqlcmd) {
            $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\SQLCMD.EXE' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $found) { throw 'sqlcmd.exe is not on PATH and not under Client SDK\ODBC.' }
            $env:PATH = "$($found.DirectoryName);$env:PATH"
            [IO.File]::AppendAllText($env:GITHUB_PATH, "$($found.DirectoryName)`n")
            $sqlcmd = Get-Command sqlcmd.exe
          }
          Write-Output "sqlcmd: $($sqlcmd.Source) $($sqlcmd.Version)"
          for ($i = 1; $i -le 30; $i++) {
            sqlcmd -S localhost -E -C -b -Q 'SELECT 1' | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          $engine = sqlcmd -S localhost -E -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT CONCAT(CAST(SERVERPROPERTY('ProductVersion') AS nvarchar(128)), ' | ', CAST(SERVERPROPERTY('Edition') AS nvarchar(128)), ' | mixed authentication: ', 1 - CAST(SERVERPROPERTY('IsIntegratedSecurityOnly') AS int))"
          if ($LASTEXITCODE -ne 0) { throw "sqlcmd exited with $LASTEXITCODE" }
          $line = "Database Engine: $(($engine | Where-Object { $_ }) -join ' '); SQL Server Agent running"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          # Where the instance keeps its files: system databases and the defaults for new databases.
          $files = sqlcmd -S localhost -E -C -b -h -1 -W -s '|' -Q "SET NOCOUNT ON; SELECT 'default data', CAST(SERVERPROPERTY('InstanceDefaultDataPath') AS nvarchar(260)) UNION ALL SELECT 'default log', CAST(SERVERPROPERTY('InstanceDefaultLogPath') AS nvarchar(260)) UNION ALL SELECT DB_NAME(database_id) + ' ' + name, physical_name FROM sys.master_files"
          if ($LASTEXITCODE -ne 0) { throw "the sys.master_files query exited with $LASTEXITCODE" }
          $files = @($files | Where-Object { $_ -match '\|' })
          Set-Content -Encoding UTF8 -Path "$env:EVIDENCE/master_files.txt" -Value $files
          $files
          $paths = @($files | ForEach-Object { ($_ -split '\|', 2)[1] })
          $root = if ($env:SQL_DATA_ROOT) { $env:SQL_DATA_ROOT } else { 'C:\' }
          $outside = @($paths | Where-Object { -not $_.StartsWith($root, [StringComparison]::OrdinalIgnoreCase) })
          $line = "database files: $($paths.Count - 2) files of system databases and both default paths under $root, outside: $($outside.Count)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($files.Count -lt 3 -or $outside.Count -gt 0) { throw "Database files or default paths outside ${root}: $($outside -join ', ')" }

      - name: 3a. Download the Reporting Services installer; SHA-256 and signature
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'SQLServerReportingServices.exe'
          curl.exe -fsSL --retry 3 -o $exe $env:SSRS_URL
          if ($LASTEXITCODE -ne 0) { throw "curl exited with $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $version = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          $line = "SSRS media: SQLServerReportingServices.exe $version, $((Get-Item -LiteralPath $exe).Length) bytes, SHA-256 $hash, signature $($signature.Status) ($($signature.SignerCertificate.Subject))"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($hash -notin @($env:SSRS_SHA256, $env:SSRS_SHA256_ALT)) { throw "SHA-256 differs from both pinned values $env:SSRS_SHA256 and $env:SSRS_SHA256_ALT (Microsoft may have replaced the file again)" }
          if ($signature.Status -ne 'Valid') { throw 'The installer signature is not valid.' }
          if ($signature.SignerCertificate.Subject -notlike 'CN=Microsoft Corporation,*') { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }

      - name: 3b. Install SQL Server 2022 Reporting Services, Developer edition
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'SQLServerReportingServices.exe'
          $log = Join-Path $env:RUNNER_TEMP 'ssrs-install.log'
          # Quiet install: https://learn.microsoft.com/sql/reporting-services/install-windows/install-reporting-services
          # (command line options /quiet, /IAcceptLicenseTerms, /Edition=Dev, /log); exit codes as in the
          # Chocolatey package ssrs-2022: 0, 1641 and 3010.
          $arguments = "/quiet /norestart /IAcceptLicenseTerms /Edition=Dev /log `"$log`""
          Write-Output "installer arguments: $arguments"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          $code = $process.ExitCode
          $line = "SSRS setup: exit code $code in $([math]::Round($watch.Elapsed.TotalMinutes, 1)) min (/Edition=Dev)"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if (@(0, 1641, 3010) -notcontains $code) {
            Get-ChildItem $log, "$env:TEMP\SSRS*.log" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "--- $($_.FullName) (tail) ---"; Get-Content $_.FullName -Tail 60 }
            throw "The Reporting Services installer exited with $code"
          }
          Get-CimInstance Win32_Service -Filter "Name='SQLServerReportingServices'" | Format-List Name, State, StartMode, StartName, PathName

      - name: 3c. Configure Reporting Services - catalog, URLs, e-mail, Basic authentication (scripts/Initialize-ReportServer.ps1)
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & .\scripts\Initialize-ReportServer.ps1 -Port 80 -SmtpServer 127.0.0.1 -SmtpPort 25 -OutDir "$env:EVIDENCE/config" |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/initialize.txt" -Value $_; $_ }
          } finally {
            whoami /groups | Select-String -Pattern 'Administrators|Mandatory Label' | ForEach-Object { Write-Output "runner token: $($_.Line.Trim())" }
            Write-Output "EnableLUA: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System').EnableLUA)"
            Get-Content "$env:EVIDENCE/initialize.txt" -ErrorAction SilentlyContinue |
              Where-Object { $_ -match '^(Reporting Services (version|edition|initialized)|web service)' } |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_ }
          }

      - name: 4. RetailLab - schema, CSV load, procedures; totals and tests/test_mssql.py on this instance
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          # The CSV files go to a folder the SQL Server service account can read (docs/MANUAL_STEPS.md, step 4).
          $import = 'C:\retail-import'
          New-Item -ItemType Directory -Force -Path $import | Out-Null
          Copy-Item data\*.csv $import
          icacls $import /grant 'NT Service\MSSQLSERVER:(OI)(CI)R' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls exited with $LASTEXITCODE" }
          $scripts = Join-Path $env:RUNNER_TEMP 'retail-sql'
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          Copy-Item sql\01-schema.sql, sql\03-datasets.sql $scripts
          (Get-Content -Raw sql\02-load.sql).Replace('/var/opt/mssql/import/', "$import\") |
            Set-Content -Encoding ASCII -Path (Join-Path $scripts '02-load.sql')
          sqlcmd -S localhost -E -C -b -Q "CREATE DATABASE RetailLab COLLATE Latin1_General_100_CI_AS_SC_UTF8"
          if ($LASTEXITCODE -ne 0) { throw "CREATE DATABASE exited with $LASTEXITCODE" }
          foreach ($name in '01-schema.sql', '02-load.sql', '03-datasets.sql') {
            sqlcmd -S localhost -E -C -b -d RetailLab -i (Join-Path $scripts $name)
            if ($LASTEXITCODE -ne 0) { throw "$name exited with $LASTEXITCODE" }
          }
          $query = "SET NOCOUNT ON; SELECT (SELECT COUNT(*) FROM dbo.Sales), (SELECT COUNT(*) FROM dbo.Stock), (SELECT SUM(Units) FROM dbo.Sales WHERE Day BETWEEN '20260101' AND '20260131'), (SELECT SUM(RevenueCents) FROM dbo.Sales WHERE Day BETWEEN '20260101' AND '20260131'), (SELECT SUM(OnHand) FROM dbo.Stock WHERE Day = '20260131')"
          $row = sqlcmd -S localhost -E -C -d RetailLab -b -h -1 -W -s '|' -Q $query
          if ($LASTEXITCODE -ne 0) { throw "the count query exited with $LASTEXITCODE" }
          $values = (($row | Where-Object { $_ -match '\|' }) -split '\|') | ForEach-Object { [long]$_ }
          $total = (Get-Content -Raw -Encoding UTF8 reports/reference.json | ConvertFrom-Json).all.total
          $expected = [long[]]((Import-Csv data\Sales.csv).Count, (Import-Csv data\Stock.csv).Count, $total.Units, $total.RevenueCents, $total.OnHand)
          $labels = 'Sales rows', 'Stock rows', 'January units', 'January revenue cents', 'stock on 31 January'
          $bad = @()
          for ($i = 0; $i -lt 5; $i++) {
            Write-Output ('{0}: {1} (expected {2})' -f $labels[$i], $values[$i], $expected[$i])
            if ($values[$i] -ne $expected[$i]) { $bad += $labels[$i] }
          }
          $line = 'RetailLab: ' + (($labels | ForEach-Object -Begin { $k = 0 } -Process { "$_ $($values[$k++])" }) -join ', ')
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $line
          Write-Output $line
          if ($values.Count -ne 5 -or $bad.Count -gt 0) { throw "RetailLab differs from the CSV and the reference: $($bad -join ', ')" }
          # The 12 checks of the Linux stand against this instance: same tests, sqlcmd of the runner.
          $env:RETAIL_SQLCMD = '["sqlcmd", "-S", "localhost", "-E", "-C", "-f", "65001"]'
          $env:RETAIL_SQL_DIR = $scripts
          python -m pytest -v -m slow tests/test_mssql.py | ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/test_mssql.txt" -Value $_; $_ }
          $code = $LASTEXITCODE
          $last = Get-Content "$env:EVIDENCE/test_mssql.txt" | Where-Object { $_ -match '(passed|failed|error)' } | Select-Object -Last 1
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "tests/test_mssql.py on Windows SQL Server: $last"
          if ($code -ne 0) { throw "pytest exited with $code" }
          # The SQL login whose credentials the report data source stores.
          $env:ReaderLogin = $env:READER_LOGIN
          $env:ReaderPassword = $env:READER_PASSWORD
          sqlcmd -S localhost -E -C -b -d RetailLab -i sql/grant_report_reader.sql
          if ($LASTEXITCODE -ne 0) { throw "sql/grant_report_reader.sql exited with $LASTEXITCODE" }
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "report reader login: $env:READER_LOGIN (db_datareader, EXECUTE on dbo)"

      - name: 5. Publish /Retail/SalesStock with stored credentials (scripts/Publish-Report.ps1)
        id: publish
        run: |
          $ErrorActionPreference = 'Stop'
          # Local account of the subscription client; the script signs in with HTTP Basic.
          $secure = ConvertTo-SecureString $env:CLIENT_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:RS_CLIENT -Password $secure -PasswordNeverExpires -AccountNeverExpires -Description 'SSRS subscription client' | Out-Null
          $client = "$env:COMPUTERNAME\$env:RS_CLIENT"
          try {
            & .\scripts\Publish-Report.ps1 -Url $env:RS_URL -ClientUser $client -ReaderLogin $env:READER_LOGIN -Definition rdl/SalesStock.rdl -OutDir $env:EVIDENCE |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/publish.txt" -Value $_; $_ }
          } finally {
            Get-Content "$env:EVIDENCE/publish.txt" -ErrorAction SilentlyContinue |
              Where-Object { $_ -match '^(published|data source Retail stored|TestConnectForItemDataSource|Basic authentication)' } |
              ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value $_ }
          }

      - name: 6. Render the five cases on the server (scripts/Export-Report.ps1) and recount (scripts/check_render.py)
        id: render
        if: always() && steps.publish.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $render = "$env:EVIDENCE/render"
          & .\scripts\Export-Report.ps1 -Url $env:RS_URL -Replay docs/runs/2026-11-19-render/replay.zip -OutDir $render
          Copy-Item docs/runs/2026-11-19-render/replay.zip $render
          python scripts/check_render.py --render-dir $render | ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/check_render.txt" -Value $_; $_ }
          $code = $LASTEXITCODE
          $last = Get-Content "$env:EVIDENCE/check_render.txt" | Select-Object -Last 1
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "server render recount (scripts/check_render.py): $last"
          if ($code -ne 0) { throw "check_render.py exited with $code" }
          # The page header of 8-18 January must name stores 02 and 06 (the local render printed ids).
          python scripts/check_server.py header --pdf "$render/partial.pdf" --regions 1 2 --stores 2 6 --categories 2 1 4 3 |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/header.txt" -Value $_; $_ }
          $code = $LASTEXITCODE
          $header = (Get-Content -Encoding UTF8 "$env:EVIDENCE/header.txt" | Where-Object { $_ }) -join '; '
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "server page header: $header"
          if ($code -ne 0) { throw "check_server.py header exited with $code" }

      - name: 7. Parameter cascade on the server (GetItemParameters, scripts/Get-ReportParameters.ps1)
        id: cascade
        if: always() && steps.publish.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $results = @()
          foreach ($case in @(@{ Name = 'north'; Regions = @(1) }, @{ Name = 'both'; Regions = @(1, 2) })) {
            $dump = "$env:EVIDENCE/cascade/cascade-$($case.Name).json"
            New-Item -ItemType Directory -Force -Path "$env:EVIDENCE/cascade" | Out-Null
            & .\scripts\Get-ReportParameters.ps1 -Url $env:RS_URL -Regions $case.Regions -OutFile $dump
            python scripts/check_server.py cascade --dump $dump --regions $case.Regions | Tee-Object -Variable checked
            $results += $LASTEXITCODE
            Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "server $(@($checked)[0])"
          }
          if ($results | Where-Object { $_ -ne 0 }) { throw 'The cascade on the server differs from the CSV.' }

      - name: 8. E-mail subscription by the project script, run through its SQL Server Agent job
        id: mail
        if: always() && steps.publish.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $mail = "$env:EVIDENCE/mail"
          $python = (Get-Command python).Source
          # Local SMTP receiver (aiosmtpd): stores every message as a file, relays nothing.
          $sink = Start-Process -FilePath $python -ArgumentList 'scripts/smtp_sink.py', '--host', '127.0.0.1', '--port', '25', '--out', $mail `
            -RedirectStandardOutput "$env:EVIDENCE/smtp-sink.log" -RedirectStandardError "$env:EVIDENCE/smtp-sink.err" -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path "$mail/ready"); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path "$mail/ready")) { Get-Content "$env:EVIDENCE/smtp-sink.err" -ErrorAction SilentlyContinue; throw 'The SMTP receiver did not start.' }
          Write-Output "SMTP receiver: process $($sink.Id), $(Get-Content "$mail/ready")"
          # First live run of the subscription script: plain HTTP is accepted only for localhost.
          $env:SSRS_SOAP_URL = "$env:RS_URL/ReportService2010.asmx"
          $env:SSRS_USER = "$env:COMPUTERNAME\$env:RS_CLIENT"
          $env:SSRS_PASSWORD = $env:CLIENT_PASSWORD
          $output = python -m ssrs_lab.subscription subscription/windows-runner.json
          if ($LASTEXITCODE -ne 0) { throw "ssrs_lab.subscription exited with $LASTEXITCODE" }
          $id = "$(@($output)[-1])".Trim()
          if ($id -notmatch '^[0-9a-fA-F-]{36}$') { throw "Unexpected subscription id: $id" }
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "subscription created by python -m ssrs_lab.subscription: $id"
          # SSRS keeps one SQL Server Agent job per subscription schedule, named by the schedule id.
          $job = sqlcmd -S localhost -E -C -b -h -1 -W -d ReportServer -Q "SET NOCOUNT ON; SELECT CAST(rs.ScheduleID AS nvarchar(36)) FROM dbo.ReportSchedule AS rs WHERE rs.SubscriptionID = '$id'"
          if ($LASTEXITCODE -ne 0) { throw "the schedule query exited with $LASTEXITCODE" }
          $job = "$(@($job | Where-Object { $_.Trim() })[0])".Trim()
          sqlcmd -S localhost -E -C -b -W -Q "SELECT j.name, j.enabled, s.name AS schedule, s.active_start_date, s.active_start_time FROM msdb.dbo.sysjobs AS j LEFT JOIN msdb.dbo.sysjobschedules AS js ON js.job_id = j.job_id LEFT JOIN msdb.dbo.sysschedules AS s ON s.schedule_id = js.schedule_id WHERE j.name = N'$job'"
          sqlcmd -S localhost -E -C -b -Q "EXEC msdb.dbo.sp_start_job @job_name = N'$job'"
          if ($LASTEXITCODE -ne 0) { throw "sp_start_job $job exited with $LASTEXITCODE" }
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "SQL Server Agent job of the subscription schedule started: $job"
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $status = ''
          while ($watch.Elapsed.TotalMinutes -lt 8) {
            Start-Sleep -Seconds 10
            $status = "$(sqlcmd -S localhost -E -C -b -h -1 -W -d ReportServer -Q "SET NOCOUNT ON; SELECT LastStatus FROM dbo.Subscriptions WHERE SubscriptionID = '$id'")".Trim()
            Write-Output "$([math]::Round($watch.Elapsed.TotalSeconds)) s: LastStatus '$status', messages $(@(Get-ChildItem "$mail/*.eml" -ErrorAction SilentlyContinue).Count)"
            if ($status -match '^Mail sent' -and (Test-Path "$mail/*.eml")) { break }
            if ($status -match 'Failure|Error|failed') { break }
          }
          sqlcmd -S localhost -E -C -W -Q "SELECT TOP 5 h.step_id, h.run_status, h.run_date, h.run_time, h.message FROM msdb.dbo.sysjobhistory AS h JOIN msdb.dbo.sysjobs AS j ON j.job_id = h.job_id WHERE j.name = N'$job' ORDER BY h.instance_id DESC"
          sqlcmd -S localhost -E -C -W -d ReportServer -Q "SELECT TOP 10 ItemPath, RequestType, Format, Status, TimeStart, ByteCount, [RowCount] FROM dbo.ExecutionLog3 ORDER BY TimeStart DESC"
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "subscription LastStatus: $status"
          if ($status -notmatch '^Mail sent') { throw "The subscription did not send mail: $status" }
          python scripts/check_server.py mail --maildir $mail --to $env:MAIL_TO --case north --out "$mail/attachment" |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/mail.txt" -Value $_; $_ }
          $code = $LASTEXITCODE
          Get-Content "$env:EVIDENCE/mail.txt" | Where-Object { $_ -match '^(north|mail)' } |
            ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "subscription $_" }
          if ($code -ne 0) { throw "check_server.py mail exited with $code" }

      - name: 9. Negative controls on the server answers (tests/test_check_render.py, tests/test_check_server.py)
        if: always() && steps.publish.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = New-Object Text.UTF8Encoding($false)
          $inputs = @()
          if (Test-Path "$env:EVIDENCE/render/all.xlsx") { $env:SSRS_RENDER_DIR = (Resolve-Path "$env:EVIDENCE/render").Path; $inputs += 'server render' }
          if (Test-Path "$env:EVIDENCE/cascade/cascade-both.json") { $env:SSRS_CASCADE_DIR = (Resolve-Path "$env:EVIDENCE/cascade").Path; $inputs += 'server cascade' }
          if (Test-Path "$env:EVIDENCE/mail/attachment/north.xlsx") { $env:SSRS_MAIL_XLSX = (Resolve-Path "$env:EVIDENCE/mail/attachment/north.xlsx").Path; $inputs += 'mail attachment' }
          if ($inputs.Count -eq 0) { throw 'No server answers to test.' }
          Write-Output "inputs: $($inputs -join ', ')"
          python -m pytest -v tests/test_check_render.py tests/test_check_server.py | ForEach-Object { Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/negative.txt" -Value $_; $_ }
          $code = $LASTEXITCODE
          $last = Get-Content "$env:EVIDENCE/negative.txt" | Where-Object { $_ -match '(passed|failed|error)' } | Select-Object -Last 1
          Add-Content -Encoding UTF8 -Path "$env:EVIDENCE/summary.txt" -Value "negative controls on $($inputs -join ', '): $last"
          if ($code -ne 0) { throw "pytest exited with $code" }

      - name: Logs of setup, SQL Server, SQL Server Agent and Reporting Services (on failure)
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path "$env:EVIDENCE/logs" | Out-Null
          if (Test-Path -LiteralPath $env:SETUP_LOG) {
            Copy-Item -Recurse -Force -LiteralPath $env:SETUP_LOG -Destination "$env:EVIDENCE/logs/setup-bootstrap"
          }
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ssrs-install.log'), "$env:TEMP\SSRS*.log" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "$env:EVIDENCE/logs/"
          # The instance logs live under the data root: the default one or SQL_DATA_ROOT (step 2b).
          foreach ($root in @('C:\Program Files\Microsoft SQL Server', $env:SQL_DATA_ROOT) | Where-Object { $_ }) {
            Get-ChildItem "$root\MSSQL16.*\MSSQL\Log\ERRORLOG", "$root\MSSQL16.*\MSSQL\Log\SQLAGENT.OUT" -ErrorAction SilentlyContinue |
              Copy-Item -Destination "$env:EVIDENCE/logs/"
          }
          if (Test-Path -LiteralPath $env:RS_LOG) {
            Copy-Item -Recurse -Force -LiteralPath $env:RS_LOG -Destination "$env:EVIDENCE/logs/ssrs-logfiles"
            Get-ChildItem $env:RS_LOG -Filter '*.log' | Sort-Object LastWriteTime | Select-Object -Last 2 |
              ForEach-Object { Write-Output "--- $($_.Name) (tail) ---"; Get-Content $_.FullName -Tail 80 }
          }
          exit 0

      - name: 10. Summary
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $file = "$env:EVIDENCE/summary.txt"
          $lines = @(Get-Content -Encoding UTF8 $file -ErrorAction SilentlyContinue)
          foreach ($key in 'reference:', 'SQL Server media:', 'sectors C:', 'SQL Server data:', 'SQL Server setup:', 'Database Engine:', 'database files:', 'SSRS media:', 'SSRS setup:',
                           'Reporting Services version', 'Reporting Services edition', 'Reporting Services initialized', 'RetailLab:',
                           'tests/test_mssql.py on Windows', 'published', 'TestConnectForItemDataSource', 'Basic authentication',
                           'server render recount', 'server page header', 'server cascade', 'subscription created',
                           'SQL Server Agent job', 'subscription LastStatus', 'subscription mail', 'negative controls') {
            if (-not ($lines | Where-Object { $_.Contains($key) })) { $lines += "$key not reached" }
          }
          $lines | Set-Content -Encoding UTF8 $file
          $lines
          $markdown = @('### SSRS on Windows') + ($lines | ForEach-Object { "- $_" })
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($markdown -join "`n") + "`n")

      - name: 11. Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssrs-windows-evidence
          path: |
            reports/ssrs/
            reports/reference.json
          retention-days: 30
          if-no-files-found: warn
